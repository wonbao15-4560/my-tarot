<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔮 나의 타로 도감</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f7f3ff;
  color:#292334;
}

header{
  background:linear-gradient(135deg,#6c3fa5,#9b6bd3);
  color:white;
  padding:28px 18px 24px;
  text-align:center;
}

header h1{
  margin:0 0 8px;
  font-size:28px;
}

header p{
  margin:0;
  opacity:.9;
}

.container{
  max-width:850px;
  margin:auto;
  padding:20px;
}

.search{
  width:100%;
  padding:16px 18px;
  border:2px solid #ded1f0;
  border-radius:16px;
  font-size:16px;
  outline:none;
  background:white;
}

.search:focus{
  border-color:#8654bd;
}

.section-title{
  margin:25px 0 12px;
  font-size:21px;
}

.deck-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
}

.deck{
  background:white;
  border:2px solid #e5d9f2;
  border-radius:18px;
  padding:18px 12px;
  cursor:pointer;
  transition:.2s;
  text-align:center;
}

.deck:hover{
  transform:translateY(-2px);
  border-color:#9364c7;
}

.deck .symbol{
  font-size:35px;
  margin-bottom:8px;
}

.deck h3{
  margin:5px 0;
  font-size:17px;
}

.deck p{
  margin:5px 0 0;
  color:#777;
  font-size:13px;
}

.hidden{
  display:none;
}

.back{
  border:0;
  background:white;
  border-radius:12px;
  padding:11px 15px;
  font-size:15px;
  cursor:pointer;
  margin-bottom:15px;
}

.deck-header{
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 3px 12px #0000000d;
}

.deck-header h2{
  margin:0 0 8px;
}

.stats{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.stat{
  flex:1;
  min-width:120px;
  background:#f1e9fb;
  border-radius:14px;
  padding:14px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:24px;
  color:#7041a4;
}

.card-search{
  margin:18px 0;
}

.card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:12px;
}

.tarot-card{
  background:white;
  border:2px solid #e6dced;
  border-radius:18px;
  padding:18px 12px;
  min-height:145px;
  cursor:pointer;
  text-align:center;
  position:relative;
}

.tarot-card.learned{
  border-color:#8b5bb9;
  background:#fcf9ff;
}

.card-number{
  color:#9877b5;
  font-size:12px;
  margin-bottom:8px;
}

.card-name{
  font-weight:bold;
  font-size:17px;
  margin:12px 0;
}

.question{
  font-size:30px;
  color:#aaa;
  margin:15px 0;
}

.learn-badge{
  display:inline-block;
  background:#eee3fa;
  color:#7041a4;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
}

.card-detail{
  background:white;
  border-radius:20px;
  padding:22px;
}

.card-detail h2{
  margin-top:0;
}

.meaning{
  background:#f6f0fc;
  padding:15px;
  border-radius:14px;
  line-height:1.6;
}

label{
  display:block;
  font-weight:bold;
  margin:20px 0 8px;
}

textarea{
  width:100%;
  min-height:160px;
  resize:vertical;
  border:2px solid #ded1f0;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  font-family:inherit;
  outline:none;
}

textarea:focus{
  border-color:#8654bd;
}

button.primary{
  width:100%;
  margin-top:14px;
  border:0;
  background:#7547a9;
  color:white;
  padding:15px;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
}

button.primary:hover{
  background:#62388f;
}

.learn-button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border-radius:14px;
  border:2px solid #7547a9;
  background:white;
  color:#7547a9;
  font-size:16px;
  cursor:pointer;
}

.learn-button.active{
  background:#7547a9;
  color:white;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

footer{
  text-align:center;
  color:#888;
  padding:30px 15px;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <h1>🔮 나의 타로 도감</h1>
  <p>배운 타로 카드를 기록하고 나만의 도감을 만들어보세요.</p>
</header>

<div class="container">

  <!-- 메인 -->
  <section id="home">

    <input
      id="deckSearch"
      class="search"
      placeholder="🔎 타로 카드 종류를 검색해보세요"
      oninput="searchDecks()"
    >

    <h2 class="section-title">📚 타로 카드 도감</h2>

    <div id="deckList" class="deck-grid"></div>

  </section>


  <!-- 덱 화면 -->
  <section id="deckPage" class="hidden">

    <button class="back" onclick="goHome()">← 타로 종류로 돌아가기</button>

    <div id="deckInfo" class="deck-header"></div>

    <input
      id="cardSearch"
      class="search card-search"
      placeholder="🔎 카드 이름 검색"
      oninput="searchCards()"
    >

    <div id="cardList" class="card-grid"></div>

  </section>


  <!-- 카드 상세 -->
  <section id="cardPage" class="hidden">

    <button class="back" onclick="backToDeck()">← 카드 도감으로 돌아가기</button>

    <div id="cardDetail" class="card-detail"></div>

  </section>

</div>

<footer>
  나의 타로 도감 🔮 · 학습 기록은 이 기기의 브라우저에 저장됩니다.
</footer>


<script>

/* =========================
   타로 카드 데이터
========================= */

const majorArcana = [
  "바보",
  "마법사",
  "여사제",
  "여황제",
  "황제",
  "교황",
  "연인",
  "전차",
  "힘",
  "은둔자",
  "운명의 수레바퀴",
  "정의",
  "매달린 사람",
  "죽음",
  "절제",
  "악마",
  "탑",
  "별",
  "달",
  "태양",
  "심판",
  "세계"
];

const wands = [
  "지팡이 에이스",
  "지팡이 2",
  "지팡이 3",
  "지팡이 4",
  "지팡이 5",
  "지팡이 6",
  "지팡이 7",
  "지팡이 8",
  "지팡이 9",
  "지팡이 10",
  "지팡이 시종",
  "지팡이 기사",
  "지팡이 여왕",
  "지팡이 왕"
];

const cups = [
  "컵 에이스",
  "컵 2",
  "컵 3",
  "컵 4",
  "컵 5",
  "컵 6",
  "컵 7",
  "컵 8",
  "컵 9",
  "컵 10",
  "컵 시종",
  "컵 기사",
  "컵 여왕",
  "컵 왕"
];

const swords = [
  "검 에이스",
  "검 2",
  "검 3",
  "검 4",
  "검 5",
  "검 6",
  "검 7",
  "검 8",
  "검 9",
  "검 10",
  "검 시종",
  "검 기사",
  "검 여왕",
  "검 왕"
];

const pentacles = [
  "펜타클 에이스",
  "펜타클 2",
  "펜타클 3",
  "펜타클 4",
  "펜타클 5",
  "펜타클 6",
  "펜타클 7",
  "펜타클 8",
  "펜타클 9",
  "펜타클 10",
  "펜타클 시종",
  "펜타클 기사",
  "펜타클 여왕",
  "펜타클 왕"
];

const riderCards = [
  ...majorArcana,
  ...wands,
  ...cups,
  ...swords,
  ...pentacles
];


/* =========================
   덱 목록
========================= */

const decks = [
  {
    id:"marseille",
    name:"마르세유 타로",
    symbol:"🎴",
    description:"Tarot de Marseille",
    cards:riderCards
  },
  {
    id:"rider",
    name:"라이더 웨이트",
    symbol:"🌟",
    description:"Rider-Waite-Smith",
    cards:riderCards
  },
  {
    id:"thoth",
    name:"토트 타로",
    symbol:"✨",
    description:"Thoth Tarot",
    cards:riderCards
  },
  {
    id:"lenormand",
    name:"르노르망",
    symbol:"🃏",
    description:"Lenormand",
    cards:[
      "기수","클로버","배","집","나무","구름","뱀","관","꽃다발",
      "낫","채찍","새","아이","여우","곰","별","황새","개",
      "탑","정원","산","갈림길","쥐","심장","반지","책","편지",
      "남자","여자","백합","태양","달","열쇠","물고기","닻","십자가"
    ]
  },
  {
    id:"golden",
    name:"골든 던 계열",
    symbol:"☀️",
    description:"Golden Dawn",
    cards:riderCards
  },
  {
    id:"visconti",
    name:"비스콘티 스포르차",
    symbol:"👑",
    description:"Visconti-Sforza",
    cards:majorArcana
  },
  {
    id:"italian",
    name:"이탈리아 전통 타로",
    symbol:"🇮🇹",
    description:"Italian Tarot",
    cards:riderCards
  },
  {
    id:"english",
    name:"영국 전통 타로",
    symbol:"🇬🇧",
    description:"English Tarot",
    cards:riderCards
  },
  {
    id:"oracle",
    name:"오라클 카드",
    symbol:"🔮",
    description:"Oracle Cards",
    cards:[
      "새로운 시작",
      "사랑",
      "우정",
      "용기",
      "성장",
      "변화",
      "치유",
      "행운",
      "직관",
      "희망",
      "평화",
      "성공"
    ]
  }
];


/* =========================
   저장 데이터
========================= */

let learned =
  JSON.parse(localStorage.getItem("tarotLearned") || "{}");

let notes =
  JSON.parse(localStorage.getItem("tarotNotes") || "{}");

let currentDeck = null;
let currentCard = null;


function saveData(){

  localStorage.setItem(
    "tarotLearned",
    JSON.stringify(learned)
  );

  localStorage.setItem(
    "tarotNotes",
    JSON.stringify(notes)
  );
}


/* =========================
   메인 덱 목록
========================= */

function renderDecks(list=decks){

  const box = document.getElementById("deckList");

  if(list.length===0){
    box.innerHTML =
      `<div class="empty">검색 결과가 없어요 😢</div>`;
    return;
  }

  box.innerHTML = list.map(deck=>{

    const learnedCount =
      (learned[deck.id] || []).length;

    return `
      <div class="deck" onclick="openDeck('${deck.id}')">

        <div class="symbol">${deck.symbol}</div>

        <h3>${deck.name}</h3>

        <p>${deck.description}</p>

        <p>
          📚 ${deck.cards.length}장
          · ✅ ${learnedCount}장 배움
        </p>

      </div>
    `;

  }).join("");
}


function searchDecks(){

  const keyword =
    document.getElementById("deckSearch")
    .value
    .toLowerCase()
    .trim();

  const result =
    decks.filter(deck =>
      deck.name.toLowerCase().includes(keyword) ||
      deck.description.toLowerCase().includes(keyword)
    );

  renderDecks(result);
}


/* =========================
   덱 열기
========================= */

function openDeck(id){

  currentDeck =
    decks.find(deck=>deck.id===id);

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("cardPage")
    .classList.add("hidden");

  document.getElementById("deckPage")
    .classList.remove("hidden");

  document.getElementById("cardSearch").value="";

  renderDeckInfo();
  renderCards(currentDeck.cards);
}


function renderDeckInfo(){

  const learnedCount =
    (learned[currentDeck.id] || []).length;

  document.getElementById("deckInfo").innerHTML = `

    <h2>
      ${currentDeck.symbol}
      ${currentDeck.name} 도감
    </h2>

    <p>${currentDeck.description}</p>

    <div class="stats">

      <div class="stat">
        <strong>${currentDeck.cards.length}</strong>
        전체 카드
      </div>

      <div class="stat">
        <strong>${learnedCount}</strong>
        배운 카드
      </div>

      <div class="stat">
        <strong>${currentDeck.cards.length-learnedCount}</strong>
        아직 안 배움
      </div>

    </div>

  `;
}


/* =========================
   카드 목록
========================= */

function renderCards(cards){

  const box =
    document.getElementById("cardList");

  const learnedCards =
    learned[currentDeck.id] || [];

  if(cards.length===0){

    box.innerHTML =
      `<div class="empty">
        검색 결과가 없어요 😢
      </div>`;

    return;
  }

  box.innerHTML =
    cards.map((card,index)=>{

      const isLearned =
        learnedCards.includes(card);

      return `

        <div
          class="tarot-card ${isLearned ? "learned":""}"
          onclick="openCard('${encodeURIComponent(card)}')"
        >

          <div class="card-number">
            CARD ${index+1}
          </div>

          ${
            isLearned
            ?
            `<div class="card-name">
              ${card}
            </div>
            <span class="learn-badge">
              ✓ 배움
            </span>`
            :
            `
            <div class="question">???</div>
            <span class="learn-badge">
              아직 안 배움
            </span>
            `
          }

        </div>

      `;

    }).join("");
}


function searchCards(){

  const keyword =
    document.getElementById("cardSearch")
    .value
    .toLowerCase()
    .trim();

  const result =
    currentDeck.cards.filter(card =>
      card.toLowerCase().includes(keyword)
    );

  renderCards(result);
}


/* =========================
   카드 상세
========================= */

function openCard(encoded){

  currentCard =
    decodeURIComponent(encoded);

  document.getElementById("deckPage")
    .classList.add("hidden");

  document.getElementById("cardPage")
    .classList.remove("hidden");

  renderCardDetail();
}


function renderCardDetail(){

  const learnedCards =
    learned[currentDeck.id] || [];

  const isLearned =
    learnedCards.includes(currentCard);

  const noteKey =
    currentDeck.id + "::" + currentCard;

  const note =
    notes[noteKey] || "";

  document.getElementById("cardDetail").innerHTML = `

    <h2>🃏 ${currentCard}</h2>

    <p>
      ${currentDeck.symbol}
      ${currentDeck.name}
    </p>

    <div class="meaning">

      <strong>📖 나의 학습 카드</strong>

      <p>
        이 카드에 대해 내가 배운 내용을
        자유롭게 기록해보세요.
      </p>

    </div>

    <button
      class="learn-button ${isLearned ? "active":""}"
      onclick="toggleLearned()"
    >

      ${
        isLearned
        ? "✓ 배운 카드입니다"
        : "📚 이 카드를 배웠어요"
      }

    </button>

    <label>📝 ${currentCard} 개인 메모</label>

    <textarea
      id="note"
      placeholder="이 카드에서 배운 의미, 키워드, 느낀 점 등을 적어보세요."
    >${escapeHtml(note)}</textarea>

    <button
      class="primary"
      onclick="saveNote()"
    >
      💾 메모 저장
    </button>

  `;
}


function toggleLearned(){

  if(!learned[currentDeck.id]){
    learned[currentDeck.id]=[];
  }

  const arr =
    learned[currentDeck.id];

  const index =
    arr.indexOf(currentCard);

  if(index === -1){
    arr.push(currentCard);
  }else{
    arr.splice(index,1);
  }

  saveData();
  renderCardDetail();
}


/* =========================
   메모 저장
========================= */

function saveNote(){

  const value =
    document.getElementById("note").value;

  const key =
    currentDeck.id + "::" + currentCard;

  notes[key]=value;

  saveData();

  alert("메모가 저장됐어요! 📝");
}


/* =========================
   화면 이동
========================= */

function backToDeck(){

  document.getElementById("cardPage")
    .classList.add("hidden");

  document.getElementById("deckPage")
    .classList.remove("hidden");

  renderDeckInfo();
  renderCards(currentDeck.cards);
}


function goHome(){

  document.getElementById("deckPage")
    .classList.add("hidden");

  document.getElementById("cardPage")
    .classList.add("hidden");

  document.getElementById("home")
    .classList.remove("hidden");

  renderDecks();
}


/* =========================
   HTML 문자 안전 처리
========================= */

function escapeHtml(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   시작
========================= */

renderDecks();

</script>

</body>
  </html>
